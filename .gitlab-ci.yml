variables:
  FILE_NAME: "main"

build-pdf:
  stage: build
  # Public, no login needed
  image: ghcr.io/steve-li-1998/texlive-ci:latest
  script:
    # .latexmkrc selects LuaLaTeX; the image's /etc/LatexMk adds -shell-escape
    - latexmk -interaction=nonstopmode -file-line-error -synctex=1 "$FILE_NAME.tex"
  # A failed build keeps the whole working directory (without .git): logs, intermediate files,
  # any partial PDF
  after_script:
    - if [ "$CI_JOB_STATUS" = failed ]; then tar --exclude=.git --exclude=failed-build.tar.gz -czf failed-build.tar.gz .; fi
  artifacts:
    when: always
    paths:
      - $FILE_NAME.pdf
      - failed-build.tar.gz
    expire_in: 1 week
