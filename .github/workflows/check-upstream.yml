name: check-upstream

# Daily: if the Realtime TeX extension has a newer release on the Marketplace, open a pull
# request that bumps it in .devcontainer/devcontainer.json and merge it right away (the PR
# keeps a record). texlive-devcontainer's own daily check, an hour later, then moves its
# template/ submodule here.
# Runs only in the template repository, not in projects created from it.
on:
  schedule:
    - cron: "11 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    if: github.repository == 'Steve-Li-1998/texlive-devcontainer-template'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # A version counts once it is on the Marketplace: devcontainer.json installs it from there
      - name: Look for a newer extension
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(grep -o -E 'henryxiaoyang\.realtime-tex@[0-9][0-9.]*' .devcontainer/devcontainer.json | head -n 1 | cut -d@ -f2)
          new=$(gh api repos/HenryXiaoYang/realtime-tex-vsc-plugin/releases/latest --jq '.tag_name | ltrimstr("v")')
          curl -fsS -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
              -H 'Content-Type: application/json' -H 'Accept: application/json;api-version=3.0-preview.1' \
              -d '{"filters":[{"criteria":[{"filterType":7,"value":"henryxiaoyang.realtime-tex"}]}],"flags":1}' \
            | jq -r '.results[0].extensions[0].versions[].version' | grep -qxF "$new" || new=$old
          changed=false
          if [ "$old" != "$new" ] && [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)" = "$new" ]; then
            sed -i -E "s/henryxiaoyang\.realtime-tex@[0-9][0-9.]*/henryxiaoyang.realtime-tex@$new/" .devcontainer/devcontainer.json
            changed=true
          fi
          printf 'old=%s\nnew=%s\nchanged=%s\n' "$old" "$new" "$changed" | tee -a "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.bump.outputs.old }}
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          branch=upstream-update
          title="Update the Realtime TeX extension to $NEW"
          {
            echo "Found by the daily upstream check."
            echo
            echo "- Realtime TeX extension $OLD → [$NEW](https://github.com/HenryXiaoYang/realtime-tex-vsc-plugin/releases/tag/v$NEW)"
            echo
            echo "Merged automatically. texlive-devcontainer's daily check then updates its \`template/\` submodule."
          } > body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -m "$title" .devcontainer/devcontainer.json
          git push -f origin "$branch"
          gh label create upstream-update --color 0e8a16 --description "Opened by the daily upstream check" --force
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = OPEN ]; then
            gh pr edit "$branch" --title "$title" --body-file body.md
          else
            gh pr create --base main --head "$branch" --title "$title" --body-file body.md --label upstream-update
          fi
          gh pr merge "$branch" --squash --delete-branch
